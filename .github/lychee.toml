# Link checker settings, used by .github/workflows/links.yml
accept = ["200", "204", "206", "429"]
max_retries = 3
retry_wait_time = 10
timeout = 30
max_concurrency = 8
cache = true
max_cache_age = "2d"
user_agent = "Mozilla/5.0 (compatible; awesome-lists-link-check; +https://github.com/joelio/awesome-lists)"
# Only the README is checked. Skip hosts that rate limit CI or block bots.
exclude = [
  '^https://(www\.)?linkedin\.com',
  '^https://(www\.)?(twitter|x)\.com',
  '^https://img\.shields\.io',
]
